<div class="capture-page">
  <header class="capture-header">
    <div>
      <h1>Captura de Teléfonos</h1>
      <p>Registra un nuevo teléfono en el inventario.</p>
    </div>
  </header>

  <form class="capture-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="form-grid">
      <div class="field-group">
        <label for="inventoryNumber">Número de inventario</label>
        <input
          id="inventoryNumber"
          type="text"
          formControlName="inventoryNumber"
          placeholder="123456"
          [class.invalid]="isInvalid('inventoryNumber')"
        />
      </div>

      <div class="field-group">
        <label for="brand">Marca</label>
        <input
          id="brand"
          type="text"
          formControlName="brand"
          placeholder="CISCO"
          [class.invalid]="isInvalid('brand')"
        />
      </div>

      <div class="field-group">
        <label for="model">Modelo</label>
        <input
          id="model"
          type="text"
          formControlName="model"
          placeholder="IP Phone 7841"
          [class.invalid]="isInvalid('model')"
        />
      </div>

      <div class="field-group">
        <label for="serialNumber">Número de serie</label>
        <input
          id="serialNumber"
          type="text"
          formControlName="serialNumber"
          placeholder="FCH0001A2B3"
          [class.invalid]="isInvalid('serialNumber')"
        />
      </div>

      <div class="field-group">
        <label for="entityId">Entidad</label>
        <p-select
          inputId="entityId"
          formControlName="entityId"
          [options]="entityOptions()"
          optionLabel="label"
          optionValue="id"
          placeholder="Seleccionar entidad..."
          [class.invalid]="isInvalid('entityId')"
          appendTo="body"
          [filter]="true"
          filterPlaceholder="Buscar entidad..."
        />
      </div>

      <div class="field-group">
        <label for="networkAddress">Dirección IP</label>
        <input
          id="networkAddress"
          type="text"
          formControlName="networkAddress"
          placeholder="192.168.0.1"
          [class.invalid]="isInvalid('networkAddress')"
        />
      </div>

      <div class="field-group">
        <label for="extension">Extensión</label>
        <input
          id="extension"
          type="text"
          formControlName="extension"
          placeholder="1234"
          [class.invalid]="isInvalid('extension')"
        />
      </div>
    </div>

    @if (infoMessage()) {
      <p-message severity="success" [text]="infoMessage()!" styleClass="w-full" />
    }
    @if (errorMessage()) {
      <p-message severity="error" [text]="errorMessage()!" styleClass="w-full" />
    }

    <div class="form-actions">
      <p-button type="submit" label="Registrar teléfono" icon="pi pi-save" [loading]="saving()" />
    </div>
  </form>
</div>
