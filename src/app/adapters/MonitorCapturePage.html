<div class="capture-page">
  <header class="capture-header">
    <div>
      <h1>Captura de Monitores</h1>
      <p>Registra un nuevo monitor en el inventario.</p>
    </div>
  </header>

  <form class="capture-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="form-grid">
      <div class="field-group">
        <label for="inventoryNumber">Número de inventario</label>
        <input
          id="inventoryNumber"
          type="text"
          formControlName="inventoryNumber"
          placeholder="123456"
          [class.invalid]="isInvalid('inventoryNumber')"
        />
      </div>

      <div class="field-group">
        <label for="serialNumber">Número de serie</label>
        <input
          id="serialNumber"
          type="text"
          formControlName="serialNumber"
          placeholder="CN0ABC123"
          [class.invalid]="isInvalid('serialNumber')"
        />
      </div>

      <div class="field-group">
        <label for="entityId">Entidad</label>
        <p-select
          inputId="entityId"
          formControlName="entityId"
          [options]="entityOptions()"
          optionLabel="label"
          optionValue="id"
          placeholder="Seleccionar entidad..."
          [class.invalid]="isInvalid('entityId')"
          appendTo="body"
          [filter]="true"
          filterPlaceholder="Buscar entidad..."
        />
      </div>

      <div class="field-group">
        <label for="custodianId">Resguardante</label>
        <p-select
          inputId="custodianId"
          formControlName="custodianId"
          [options]="areaManagerOptions()"
          optionLabel="label"
          optionValue="id"
          placeholder="Seleccionar resguardante..."
          [class.invalid]="isInvalid('custodianId')"
          appendTo="body"
          [filter]="true"
          filterPlaceholder="Buscar resguardante..."
        />
      </div>

      <div class="field-group">
        <label for="userId">Usuario</label>
        <p-select
          inputId="userId"
          formControlName="userId"
          [options]="userOptions()"
          optionLabel="label"
          optionValue="id"
          placeholder="Seleccionar usuario..."
          [class.invalid]="isInvalid('userId')"
          appendTo="body"
          [filter]="true"
          filterPlaceholder="Buscar usuario..."
        />
      </div>

      <div class="field-group">
        <label for="locationId">Ubicación</label>
        <p-select
          inputId="locationId"
          formControlName="locationId"
          [options]="locationOptions()"
          optionLabel="label"
          optionValue="id"
          placeholder="Seleccionar ubicación..."
          [class.invalid]="isInvalid('locationId')"
          appendTo="body"
          [filter]="true"
          filterPlaceholder="Buscar ubicación..."
        />
      </div>

      <div class="field-group">
        <label for="manufacturer">Fabricante</label>
        <input
          id="manufacturer"
          type="text"
          formControlName="manufacturer"
          placeholder="DELL"
          [class.invalid]="isInvalid('manufacturer')"
        />
      </div>

      <div class="field-group">
        <label for="type">Tipo</label>
        <input
          id="type"
          type="text"
          formControlName="type"
          placeholder="LED"
          [class.invalid]="isInvalid('type')"
        />
      </div>

      <div class="field-group">
        <label for="model">Modelo</label>
        <input
          id="model"
          type="text"
          formControlName="model"
          placeholder="P2422H"
          [class.invalid]="isInvalid('model')"
        />
      </div>

      <div class="field-group">
        <label>Estado</label>
        <div>
          <p-button
            type="button"
            [label]="isActive() ? 'Activo' : 'Inactivo'"
            [severity]="isActive() ? 'success' : 'danger'"
            [outlined]="!isActive()"
            (onClick)="toggleActive()"
          />
        </div>
      </div>
    </div>

    @if (infoMessage()) {
      <p-message severity="info" [text]="infoMessage()!" styleClass="w-full" />
    }

    <div class="form-actions">
      <p-button type="submit" label="Registrar monitor" icon="pi pi-save" />
    </div>
  </form>
</div>
