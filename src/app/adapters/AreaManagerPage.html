<div class="managers-page">
  <header class="managers-header">
    <div>
      <h1>Jefes de Área</h1>
      <p>Responsables por entidad autorizados para resguardar bienes informáticos.</p>
    </div>
  </header>

  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-label">Total Jefes de Área</span>
      <span class="stat-value">{{ total() }}</span>
    </div>
    <div class="stat-card stat-card--action">
      <p-button
        label="Nuevo Jefe de Área"
        icon="pi pi-arrow-right"
        iconPos="right"
        styleClass="stat-action-btn"
        (onClick)="openCreateDialog()"
      />
    </div>
  </div>

  <div class="table-card">
    <p-table [value]="areaManagers()" [loading]="loading()" styleClass="managers-table">
      <ng-template #header>
        <tr>
          <th>Nombre</th>
          <th>Entidad</th>
          <th class="text-center">Estado</th>
          <th class="actions-header">Acciones</th>
        </tr>
      </ng-template>
      <ng-template #body let-areaManager>
        <tr>
          <td class="name-cell">{{ areaManager.name }}</td>
          <td>{{ areaManager.entity }}</td>
          <td class="text-center">
            <p-button
              [label]="areaManager.active ? 'Activo' : 'Inactivo'"
              [severity]="areaManager.active ? 'success' : 'danger'"
              [outlined]="!areaManager.active"
              [loading]="togglingIds().has(areaManager.id)"
              size="small"
              styleClass="status-toggle-btn"
              (onClick)="toggleStatus(areaManager)"
            />
          </td>
          <td>
            <div class="actions-cell">
              <p-button
                icon="pi pi-pencil"
                severity="secondary"
                [text]="true"
                [rounded]="true"
                pTooltip="Editar jefe de área"
                (onClick)="openEditDialog(areaManager)"
              />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="4" class="empty-row">No hay jefes de área registrados.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-dialog
  [header]="editingAreaManager() ? 'Editar Jefe de Área' : 'Nuevo Jefe de Área'"
  [modal]="true"
  [visible]="showCreateDialog()"
  (visibleChange)="showCreateDialog.set($event)"
  [style]="{ width: '28rem' }"
>
  <form class="create-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="field-group">
      <label for="entityId">Entidad</label>
      <p-select
        inputId="entityId"
        formControlName="entityId"
        [options]="entityOptions()"
        optionLabel="label"
        optionValue="id"
        placeholder="Seleccionar entidad..."
        [class.invalid]="isInvalid('entityId')"
        scrollHeight="220px"
        appendTo="body"
        [filter]="true"
        filterPlaceholder="Buscar entidad..."
      />
    </div>

    <div class="field-group">
      <label for="name">Nombre del resguardante</label>
      <input id="name" type="text" pInputText formControlName="name" placeholder="Ej. Juan Pérez" [class.invalid]="isInvalid('name')" />
    </div>

    @if (errorMessage()) {
      <p-message severity="error" [text]="errorMessage()!" styleClass="w-full" />
    }

    <div class="form-actions">
      <p-button type="button" label="Cancelar" severity="secondary" [outlined]="true" (onClick)="closeCreateDialog()" />
      <p-button type="submit" [label]="submitting() ? 'Guardando...' : editingAreaManager() ? 'Guardar Cambios' : 'Guardar'" [loading]="submitting()" />
    </div>
  </form>
</p-dialog>
